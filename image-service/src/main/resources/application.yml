spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB # Spring rejects any uploaded file or request body larger than 10MB before it even hits your controller.

server:
  port: 8081

# AWS S3 configuration
aws:
  s3:
    bucket: chatapp-images-bucket-v1
    region: ap-south-1
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
  presigned-url:
    upload-expiration-minutes: ${PRESIGNED_UPLOAD_EXPIRY:15}
    download-expiration-minutes: ${PRESIGNED_DOWNLOAD_EXPIRY:10080}  # 7 days (max for IAM credentials)

# Used to validate JWT tokens on incoming requests — ensures only authenticated users can upload/access image
jwt:
  secret: ${JWT_SECRET:my-super-secret-key-that-is-at-least-32-bytes-long-for-hs256}

# Allowed image types
image:
  allowed-content-types:
    - image/jpeg
    - image/png
    - image/gif
    - image/webp
  max-size-bytes: 10485760  # 10 MB

logging:
  level:
    com.chatapp: INFO
