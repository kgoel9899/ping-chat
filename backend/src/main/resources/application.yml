spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chatapp}
    username: ${DB_USER:chatapp}
    password: ${DB_PASSWORD:chatapp}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:my-super-secret-key-that-is-at-least-32-bytes-long-for-hs256}
  expiration: ${JWT_EXPIRATION:86400000}

server:
  port: 8080
